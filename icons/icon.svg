<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0080"/>
      <stop offset="35%" stop-color="#60efff"/>
      <stop offset="70%" stop-color="#00ff87"/>
      <stop offset="100%" stop-color="#ffcc00"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#0a0a0f"/>
  <!-- Camera body -->
  <rect x="10" y="20" width="44" height="30" rx="5" fill="none" stroke="url(#neon)" stroke-width="2.2" filter="url(#glow)"/>
  <!-- Lens -->
  <circle cx="32" cy="35" r="9" fill="none" stroke="#60efff" stroke-width="2" filter="url(#glow)"/>
  <circle cx="32" cy="35" r="5.5" fill="none" stroke="#00ff87" stroke-width="1.6" filter="url(#glow)"/>
  <circle cx="32" cy="35" r="2.2" fill="#ffcc00"/>
  <!-- Viewfinder / top -->
  <rect x="22" y="14" width="12" height="8" rx="2" fill="none" stroke="#ff0080" stroke-width="1.8" filter="url(#glow)"/>
  <!-- Flash / detail -->
  <circle cx="46" cy="26" r="1.8" fill="#ffcc00"/>
  <circle cx="18" cy="26" r="1.5" fill="#60efff"/>
</svg>
